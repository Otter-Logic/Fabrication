name: build

# Build *and test*, like MachineLearning, Unsupervised and StructuralDesign.
# Panelisation is geometry over plain arrays and touches no Rhino API, so the
# tests need neither Rhino nor a licence and run on a hosted runner exactly as
# they do locally.
#
# `windows-latest` only because the target framework is net7.0-windows, which
# follows Core rather than any need of this code. The test project sets
# RollForward=LatestMajor, so it runs on whatever the runner has.
#
# Five siblings. This repo names Unsupervised and StructuralEngine;
# Unsupervised references MachineLearning and MachineLearning references Core
# and Graphs, so all three have to be on disk too even though nothing here
# names them. Miss one and it falls through to a NuGet package that does not
# exist yet, which fails *restore* and reads as a missing package rather than a
# missing checkout.
#
# Cross-repo checkouts authenticate with OTTER_CI_TOKEN, a PAT with read access
# to Otter-Logic. The self-checkout keeps GITHUB_TOKEN deliberately: checkout
# persists whatever token it is given into the local git config, so the PAT goes
# only where it is needed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: Fabrication

      # The machine learning stack, bottom up: Core, the shared base, then the
      # paradigm repo whose clustering this toolkit calls.
      - uses: actions/checkout@v4
        with:
          repository: Otter-Logic/Core
          path: Core
          token: ${{ secrets.OTTER_CI_TOKEN }}

      # Graphs sits beside Core under MachineLearning, which references it - so it
      # has to be on disk wherever MachineLearning is, named or not. Miss it and
      # restore fails with NU1101 for OtterLogic.Graphs.
      - uses: actions/checkout@v4
        with:
          repository: Otter-Logic/Graphs
          path: Graphs
          token: ${{ secrets.OTTER_CI_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: Otter-Logic/MachineLearning
          path: MachineLearning
          token: ${{ secrets.OTTER_CI_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: Otter-Logic/Unsupervised
          path: Unsupervised
          token: ${{ secrets.OTTER_CI_TOKEN }}

      # The structural base the connection tools read joints through.
      - uses: actions/checkout@v4
        with:
          repository: Otter-Logic/StructuralEngine
          path: StructuralEngine
          token: ${{ secrets.OTTER_CI_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Fabrication/OtterLogic.slnx -c Release

      - name: Test
        run: dotnet test Fabrication/OtterLogic.slnx -c Release --no-build
